# Gitleaks Configuration
# Secret detection allowlists for CI/CD pipeline

title = "Gitleaks Configuration"

# CRITICAL: gitleaks REPLACES its built-in ruleset with whatever this file
# declares. Without [extend].useDefault this config would ship ZERO detection
# rules — the allowlist below would apply to nothing and every secret would pass.
# `useDefault = true` layers our allowlist ON TOP of gitleaks' full default
# ruleset (AWS, GCP, GitHub, Stripe, private keys, …). Do NOT remove this.
[extend]
useDefault = true

[allowlist]
description = "Allowlist for false positives and safe patterns"

# Path patterns to exclude from scanning
paths = [
  # Example environment files (contain placeholders, not real secrets)
  '''\.env\.example$''',

  # Dependencies (third-party code)
  '''node_modules/''',
  '''\.venv/''',
  '''__pycache__/''',

  # Test fixtures and test data
  '''tests/fixtures/''',
  '''e2e/fixtures\.ts$''',
  '''\.test\.(ts|tsx|js|jsx|py)$''',
  '''_test\.py$''',
  '''test_.*\.py$''',

  # Build artifacts and caches
  '''dist/''',
  '''build/''',
  '''\.mypy_cache/''',
  '''\.pytest_cache/''',

  # Lock files (contain package checksums, not secrets)
  '''package-lock\.json$''',
  '''yarn\.lock$''',
  '''poetry\.lock$''',
]

# Regex patterns for false positive values
regexes = [
  # Placeholder patterns in example/template files
  '''YOUR[-_].*[-_]HERE''',
  '''your[-_].*[-_]here''',
  '''REPLACE[-_]WITH[-_]''',
  '''<your[-_].*>''',

  # Common test/mock values
  '''test[-_]?api[-_]?key''',
  '''mock[-_]?secret''',
  '''fake[-_]?password''',
  '''dummy[-_]?token''',
]

# NOTE on Google "AIzaSy…" keys — deliberately NOT globally allowlisted.
# The pattern AIzaSy[A-Za-z0-9_-]{33} matches EVERY Google API key, including
# billable Maps / Cloud / Translation keys — not just public-by-design Firebase
# Web config keys. Globally ignoring it would let a real, abusable key leak.
# If you genuinely commit a public Firebase Web key, allowlist it NARROWLY by the
# exact file that holds it (add to `paths` above), e.g.:
#   '''src/firebaseConfig\.ts$'''
# Never re-add the bare key pattern to this global `regexes` list.
