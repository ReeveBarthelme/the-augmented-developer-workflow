# Gates deliberately accepted as INERT.
# Format, three fields, ` :: ` separated:
#     <hook filename> :: <the command it declares in its # GATES: line> :: <why>
#
# Read by .claude/scripts/check-gate-liveness.sh. A gate listed here is
# reported but does NOT fail the run; an inert gate NOT listed here does.
# That keeps the check useful after a deliberate decision: it stays quiet
# about what you chose and still fires on a gate that goes dark by accident.
#
# The command is part of the key on purpose. An acceptance is a decision about
# one specific command, so repointing an accepted hook's # GATES: line
# invalidates it and the run fails until someone re-decides. Removing a line
# re-arms that gate. Adding one is a decision: say who made it and when.

# No gate is accepted as dark here. The two lines below are commented-out
# worked examples from a real project that made that call. Uncomment and
# rewrite them only after you have decided, in your own project, that the gate
# is not worth the friction. An accepted gate is not protection, so say who
# decided and when.
#
# pr-verification-gate.sh :: gh pr create :: <name> <date>, creating PRs stays unblocked. Under defaultMode=auto a hook "ask" cannot surface, and the only mechanism that would (permissionDecision "deny" plus a bypass env var) blocks every `gh pr create`. Consequence: this gate is not protection; the verification and review checklist is on the agent and the reviewer, not on this hook.
# push-verification-gate.sh :: git push :: <name> <date>, pushing stays unblocked. Same mechanism and same decision as the PR gate above.
